<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Mapeador Assistido por Excel - Infralobo</title>

  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #1e1e1e; color: white; display: flex; flex-direction: column; height: 100vh; }

    header {
      background: #004b87;
      padding: 10px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 100;
    }

    .btn { padding: 8px 14px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-copy { background: #17a2b8; }
    .btn-import { background: #ffc107; color: #000; }
    .btn-undo { background: #dc3545; }
    .btn-delete { background: #e67e22; }
    .btn-delete:disabled { background: #555; opacity: 0.5; cursor: not-allowed; }
    .btn-gmaps { background: #ea4335; }
    .btn-zoom { background: #6c757d; width: 36px; text-align: center; }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      background: rgba(0,0,0,0.2);
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .main-layout { display: flex; flex-grow: 1; overflow: hidden; }

    sidebar {
      width: 340px;
      background: #111;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus { border-color: #004b87; }

    .list-container {
      flex-grow: 1;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0a0a0a;
    }

    .moradia-item {
      padding: 10px 12px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .moradia-item:hover { background: #1d2733; }
    
    .moradia-item.active {
      background: #004b87;
      color: white;
      font-weight: bold;
    }

    .moradia-item.done {
      color: #28a745;
      text-decoration: line-through;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gmaps-link {
      color: #ea4335;
      text-decoration: none;
      font-size: 12px;
      padding: 2px 4px;
      border: 1px solid #ea4335;
      border-radius: 3px;
    }

    .gmaps-link:hover {
      background: #ea4335;
      color: #fff;
    }

    .coords-badge {
      font-size: 11px;
      background: #222;
      padding: 2px 6px;
      border-radius: 3px;
      color: #ffaa00;
    }

    #map-viewport { 
      flex-grow: 1; 
      overflow: hidden; 
      position: relative; 
      background: #2b2b2b; 
      cursor: grab;
    }
    
    #map-viewport:active { cursor: grabbing; }

    #svg-wrapper { 
      position: absolute; 
      top: 0;
      left: 0;
      transform-origin: 0 0;
      display: inline-block; 
      transition: transform 0.1s ease-out;
    }
    
    svg { display: block; }

    /* Marcadores Verdes Padrão */
    .pin {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #00ff66;
      border: 1px solid #000;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.1s ease;
    }

    .pin:hover {
      transform: translate(-50%, -50%) scale(1.4);
      background: #00ffff;
      z-index: 20;
    }

    .pin.selected {
      background: #00bfff;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 8px #00bfff;
      z-index: 30;
      transform: translate(-50%, -50%) scale(1.3);
    }

    .pin-label {
      position: absolute;
      left: 8px;
      top: -4px;
      background: rgba(0,0,0,0.85);
      color: #00ff66;
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 2px;
      white-space: nowrap;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    .pin.selected .pin-label {
      color: #00bfff;
      font-weight: bold;
      border: 1px solid #00bfff;
    }

    /* Marcador Vermelho de Destaque da Pesquisa */
    .search-pin {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #ff0055;
      border: 1.5px solid #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.9);
      animation: pulseOnce 1s ease-out 1 forwards;
      cursor: pointer;
    }

    .search-pin-label {
      position: absolute;
      left: 10px;
      top: -7px;
      background: #ff0055;
      color: #ffffff;
      font-size: 9px;
      font-weight: bold;
      padding: 2px 5px;
      border-radius: 3px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    .close-pin-btn {
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
      line-height: 1;
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 3px;
      border-radius: 50%;
      user-select: none;
    }

    .close-pin-btn:hover {
      background: #000;
      color: #ff0055;
    }

    @keyframes pulseOnce {
      0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0.2; }
      50% { transform: translate(-50%, -50%) scale(1.6); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .hidden-pins .pin { display: none !important; }
    .hidden-labels .pin-label { display: none !important; }
  </style>
</head>

  <header>
    <span><strong>Modo Assistido:</strong> Selecione a moradia e clique no mapa</span>
    <button id="zoom-in" class="btn btn-zoom" title="Aumentar Zoom">+</button>
    <button id="zoom-out" class="btn btn-zoom" title="Diminuir Zoom">-</button>
    <button id="zoom-reset" class="btn btn-zoom" style="width: auto;" title="Repor Zoom">Reset</button>
    
    <label class="toggle-container">
      <input type="checkbox" id="toggle-pins" checked />

    <label class="toggle-container">

    <button id="delete-pin-btn" class="btn btn-delete" disabled title="Eliminar marcador selecionado (Delete)">Eliminar Marcador 🗑️</button>
    <button id="gmaps-btn" class="btn btn-gmaps" title="Ver moradia selecionada no Google Maps">Ver no Google Maps 📍</button>
    <button id="undo-btn" class="btn btn-undo">Desfazer (Ctrl+Z)</button>
    <button id="copy-btn" class="btn btn-copy">Exportar JSON</button>
    <button id="import-btn" class="btn btn-import">Importar JSON</button>
    <input type="file" id="file-input" accept=".json" style="display: none;" />
    <span id="progress-status">A carregar mapa...</span>
  </header>

  <div class="main-layout">

    </sidebar>

    <div id="map-viewport">

    </div>
  </div>

    const listContainer = document.getElementById('moradias-list');
    const svgHolder = document.getElementById('svg-holder');
    const wrapper = document.getElementById('svg-wrapper');
    const viewport = document.getElementById('map-viewport');
    const progressStatus = document.getElementById('progress-status');
    const copyBtn = document.getElementById('copy-btn');
    const importBtn = document.getElementById('import-btn');
    const fileInput = document.getElementById('file-input');
    const undoBtn = document.getElementById('undo-btn');
    const deletePinBtn = document.getElementById('delete-pin-btn');
    const gmapsBtn = document.getElementById('gmaps-btn');
    const searchBox = document.getElementById('search-box');
    const togglePinsBtn = document.getElementById('toggle-pins');
    const toggleLabelsBtn = document.getElementById('toggle-labels');

    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');
    const zoomResetBtn = document.getElementById('zoom-reset');

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let hasDragged = false;
    let filterQuery = '';

    let listData = moradias.map(item => ({
      moradia: item.id,
      lat: item.lat,
      lng: item.lng,
      x: null,
      y: null
    }));
    
    let selectedIndex = 0;

    async function init() {
      try {
        renderList();
        await loadSVG();
        setupPanAndZoom();
        setupSearchAndToggle();
      } catch (err) {
        console.error(err);
        progressStatus.innerText = 'Erro ao carregar MAPA Infralobo.svg';
      }
    }

    async function loadSVG() {
      const res = await fetch('MAPA Infralobo.svg');
      if (!res.ok) throw new Error('Ficheiro MAPA Infralobo.svg não encontrado.');
      const svgText = await res.text();
      svgHolder.innerHTML = svgText;

      setupMapClick();
    }

    function updateTransform() {
      wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function zoomAtPoint(factor, clientX, clientY) {
      const viewportRect = viewport.getBoundingClientRect();
      const pivotX = clientX !== undefined ? (clientX - viewportRect.left) : (viewportRect.width / 2);
      const pivotY = clientY !== undefined ? (clientY - viewportRect.top) : (viewportRect.height / 2);

      const newScale = Math.min(Math.max(0.2, scale * factor), 15);
      
      translateX = pivotX - (pivotX - translateX) * (newScale / scale);
      translateY = pivotY - (pivotY - translateY) * (newScale / scale);
      scale = newScale;

      updateTransform();
    }

    function centerMapOnPoint(x, y) {
      const viewportRect = viewport.getBoundingClientRect();
      scale = 3.5;

      translateX = (viewportRect.width / 2) - (x * scale);
      translateY = (viewportRect.height / 2) - (y * scale);
      updateTransform();
    }

    function openGoogleMaps(lat, lng) {
      if (!lat || !lng) {
        alert('Coordenadas GPS não disponíveis.');
        return;
      }
      window.open(`https://www.google.com/maps?q=${lat},${lng}`, '_blank');
    }

    function setupPanAndZoom() {
      zoomInBtn.addEventListener('click', () => zoomAtPoint(1.3));
      zoomOutBtn.addEventListener('click', () => zoomAtPoint(1 / 1.3));
      zoomResetBtn.addEventListener('click', () => { scale = 1; translateX = 0; translateY = 0; updateTransform(); });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoomAtPoint(factor, e.clientX, e.clientY);
      }, { passive: false });

      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || e.target.closest('.pin-label') || e.target.closest('.search-pin-label')) return;
        isDragging = true;
        hasDragged = false;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        hasDragged = true;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => { isDragging = false; });
    }

    function setupSearchAndToggle() {
      searchBox.addEventListener('input', (e) => {
        filterQuery = e.target.value.toLowerCase().trim();
        renderList();
      });

      togglePinsBtn.addEventListener('change', (e) => {
        if (e.target.checked) {
          svgHolder.classList.remove('hidden-pins');
        } else {
          svgHolder.classList.add('hidden-pins');
        }
      });

      toggleLabelsBtn.addEventListener('change', (e) => {
        if (e.target.checked) {
          svgHolder.classList.remove('hidden-labels');
        } else {
          svgHolder.classList.add('hidden-labels');
        }
      });

      gmapsBtn.addEventListener('click', () => {
        const item = listData[selectedIndex];
        if (item) openGoogleMaps(item.lat, item.lng);
      });

      deletePinBtn.addEventListener('click', deleteSelectedPin);
    }

    function deleteSelectedPin() {
      if (selectedIndex >= 0 && selectedIndex < listData.length) {
        const item = listData[selectedIndex];
        if (item.x !== null) {
          item.x = null;
          item.y = null;
          removeSearchPin();
          renderPins();
          renderList();
        }
      }
    }

    function renderList() {
      listContainer.innerHTML = '';
      let doneCount = 0;

      listData.forEach((item, index) => {
        if (item.x !== null) doneCount++;

        if (filterQuery && !item.moradia.toLowerCase().includes(filterQuery)) {
          return;
        }

        const div = document.createElement('div');
        div.className = `moradia-item ${index === selectedIndex ? 'active' : ''} ${item.x !== null ? 'done' : ''}`;
        
        div.innerHTML = `
          <span>${item.moradia}</span>
          <div class="item-right">
            <a href="#" class="gmaps-link" title="Abrir no Google Maps">📍</a>
            ${item.x !== null ? `<span class="coords-badge">X:${item.x} Y:${item.y}</span>` : ''}
          </div>
        `;

        div.addEventListener('click', (e) => {
          if (e.target.classList.contains('gmaps-link')) {
            e.stopPropagation();
            openGoogleMaps(item.lat, item.lng);
            return;
          }

          selectedIndex = index;
          renderList();
          renderPins();

          if (item.x !== null && item.y !== null) {
            centerMapOnPoint(item.x, item.y);
            renderSearchPin(item);
          } else {
            removeSearchPin();
          }
        });

        listContainer.appendChild(div);
      });

      const activeEl = listContainer.querySelector('.moradia-item.active');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });

      progressStatus.innerText = `Progresso: ${doneCount} / ${listData.length} moradias mapeadas`;
      
      const currentItem = listData[selectedIndex];
      deletePinBtn.disabled = !currentItem || currentItem.x === null;
    }

    function setupMapClick() {
      const svgEl = svgHolder.querySelector('svg');
      if (!svgEl) return;

      svgEl.addEventListener('click', (e) => {
        if (hasDragged || e.target.closest('.pin') || e.target.closest('.search-pin') || selectedIndex >= listData.length) return;

        const pt = svgEl.createSVGPoint();
        pt.x = e.clientX;
        pt.y = e.clientY;
        const cursorPt = pt.matrixTransform(svgEl.getScreenCTM().inverse());

        const x = Math.round(cursorPt.x);
        const y = Math.round(cursorPt.y);

        listData[selectedIndex].x = x;
        listData[selectedIndex].y = y;

        if (selectedIndex < listData.length - 1) {
          selectedIndex++;
        }

        renderPins();
        renderList();
      });
    }

    function renderPins() {
      document.querySelectorAll('.pin').forEach(el => el.remove());

      listData.forEach((item, index) => {
        if (item.x !== null && item.y !== null) {
          const pin = document.createElement('div');
          pin.className = `pin ${index === selectedIndex ? 'selected' : ''}`;
          pin.style.left = `${item.x}px`;
          pin.style.top = `${item.y}px`;

          const label = document.createElement('div');
          label.className = 'pin-label';
          label.innerText = item.moradia;
          pin.appendChild(label);

          // Clique direto no marcador para o selecionar no mapa e na lista
          pin.addEventListener('click', (e) => {
            if (e.target.classList.contains('pin-label')) return; // Permite seleção de texto na etiqueta
            e.stopPropagation();
            selectedIndex = index;
            renderList();
            renderPins();
            renderSearchPin(item);
          });

          svgHolder.appendChild(pin);
        }
      });
    }

    function renderSearchPin(item) {
      removeSearchPin();

      const searchPin = document.createElement('div');
      searchPin.id = 'search-pin';
      searchPin.className = 'search-pin';
      searchPin.style.left = `${item.x}px`;
      searchPin.style.top = `${item.y}px`;

      const label = document.createElement('div');
      label.className = 'search-pin-label';
      label.innerHTML = `
        <span>${item.moradia}</span>
        <span class="close-pin-btn" title="Fechar marcador">×</span>
      `;

      label.querySelector('.close-pin-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        removeSearchPin();
      });

      searchPin.appendChild(label);
      svgHolder.appendChild(searchPin);
    }

    function removeSearchPin() {
      const existingPin = document.getElementById('search-pin');
      if (existingPin) existingPin.remove();
    }

    function undo() {
      if (selectedIndex >= 0 && listData[selectedIndex].x !== null) {
        listData[selectedIndex].x = null;
        listData[selectedIndex].y = null;
      } else if (selectedIndex > 0) {
        selectedIndex--;
        listData[selectedIndex].x = null;
        listData[selectedIndex].y = null;
      }
      renderPins();
      renderList();
    }

    undoBtn.addEventListener('click', undo);
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        undo();
      } else if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement.tagName !== 'INPUT') {
        deleteSelectedPin();
      }
    });

    copyBtn.addEventListener('click', () => {
      const mappedOnly = listData.filter(i => i.x !== null);
      const jsonStr = JSON.stringify(mappedOnly, null, 2);
      
      navigator.clipboard.writeText(jsonStr);
      
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `progresso_moradias_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      
      alert(`Exportado progresso com ${mappedOnly.length} moradias!`);
    });

    importBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const importedData = JSON.parse(event.target.result);
          
          importedData.forEach(importedItem => {
            const item = listData.find(d => d.moradia === (importedItem.moradia || importedItem.id));
            if (item) {
              item.x = importedItem.x;
              item.y = importedItem.y;
            }
          });

          const nextIndex = listData.findIndex(d => d.x === null);
          selectedIndex = nextIndex !== -1 ? nextIndex : listData.length - 1;

          renderPins();
          renderList();
          alert('Progresso importado com sucesso!');
        } catch (err) {
          alert('Ficheiro JSON inválido.');
        }
      };
      reader.readAsText(file);
    });

    init();
  </script>
</body>
</html>
